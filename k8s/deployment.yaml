apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-microservices
  template:
    metadata:
      labels:
        app: java-microservices
    spec:
      containers:
      - name: java-microservice
        image: jayanthroyg/java-microservices:latest
        ports:
        - containerPort: 8080
